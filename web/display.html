<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oir Display</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #101318; color: #98A0AE; font: 13px ui-monospace, Menlo, Consolas, monospace; }
  #screen { position: fixed; inset: 0; }
  #msg { position: fixed; top: 10px; left: 14px; z-index: 1; }
  [hidden] { display: none; }
</style>
<div id="msg">starting display...</div>
<div id="screen"></div>
<script type="module">
import RFB from '/novnc/core/rfb.js';
const msg = document.getElementById('msg');
function go() {
  const rfb = new RFB(document.getElementById('screen'),
    `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/vnc`);
  rfb.scaleViewport = true;
  let last = '';
  const push = () => navigator.clipboard.readText().then(t => {
    if (t && t !== last) { last = t; rfb.clipboardPasteFrom(t); }
  }).catch(() => {});
  rfb.addEventListener('clipboard', e => {
    last = e.detail.text;
    navigator.clipboard.writeText(last).catch(() => {});
  });
  window.addEventListener('focus', push);
  rfb.addEventListener('connect', () => { msg.hidden = true; rfb.focus(); push(); });
  rfb.addEventListener('disconnect', () => {
    msg.hidden = false; msg.textContent = 'reconnecting...';
    setTimeout(go, 2000);
  });
}
go();
</script>
